<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1117"/>
    <stop offset="100%" stop-color="#2f2508"/>
  </linearGradient>

  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFF0B0"/>
    <stop offset="100%" stop-color="#D4AF37"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1200" height="820" fill="url(#bg)"/>

<!-- Animated border -->
<rect x="8" y="8" width="1184" height="804" rx="20"
      fill="none" stroke="url(#gold)" stroke-width="2"
      stroke-dasharray="12 8">
  <animate attributeName="stroke-dashoffset"
           from="0" to="200"
           dur="8s"
           repeatCount="indefinite"/>
</rect>

<!-- Floating particles -->
<g fill="#FFD54F">
  <circle cx="90" cy="70" r="2">
    <animate attributeName="cy" values="70;40;70" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="120" r="2">
    <animate attributeName="cy" values="120;90;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="650" r="2">
    <animate attributeName="cy" values="650;620;650" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
</g>

<text x="70" y="85" font-family="Segoe UI" font-size="48"
      font-weight="700" fill="url(#gold)" filter="url(#glow)">
Yo CoderZ!
<animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
</text>

<text x="70" y="125" font-family="Segoe UI" font-size="22" fill="#F3F3F3">
This is Naman, a 16-year-old intermediate programmer with approximately
<animate attributeName="opacity" begin="0.8s" values="0;1" dur="1s" fill="freeze"/>
</text>

<text x="70" y="155" font-family="Segoe UI" font-size="22" fill="#F3F3F3">
4 years of experience in Python. Currently in Class 12 (PCM).
<animate attributeName="opacity" begin="1.2s" values="0;1" dur="1s" fill="freeze"/>
</text>

<line x1="70" x2="1130" y1="190" y2="190" stroke="#D4AF37">
<animate attributeName="x2" from="70" to="1130" dur="1.5s" fill="freeze"/>
</line>

<g font-family="Segoe UI" fill="#ECECEC" font-size="22">
<text x="70" y="235" font-size="30" fill="url(#gold)" font-weight="700">Skills</text>

<text x="90" y="275">• Python<animate attributeName="opacity" begin="1.6s" values="0;1" dur=".5s" fill="freeze"/></text>
<text x="90" y="310">• Web Development<animate attributeName="opacity" begin="1.8s" values="0;1" dur=".5s" fill="freeze"/></text>
<text x="90" y="345">• Video Editing<animate attributeName="opacity" begin="2.0s" values="0;1" dur=".5s" fill="freeze"/></text>
<text x="90" y="380">• Excel<animate attributeName="opacity" begin="2.2s" values="0;1" dur=".5s" fill="freeze"/></text>
<text x="90" y="415">• PowerPoint<animate attributeName="opacity" begin="2.4s" values="0;1" dur=".5s" fill="freeze"/></text>

<text x="620" y="235" font-size="30" fill="url(#gold)" font-weight="700">Published Projects</text>
<text x="640" y="275">• SplashScreen-engine</text>
<text x="640" y="310">• Starfall Protocol</text>
<text x="640" y="345">• Login UI Tkinter</text>
<text x="640" y="380">• Many More...</text>

<text x="70" y="500" font-size="30" fill="url(#gold)" font-weight="700">Currently Learning</text>
<text x="90" y="540">• JavaScript</text>
<text x="90" y="575">• Data Science using Python</text>
<text x="90" y="610">• AI Development</text>

<text x="620" y="500" font-size="30" fill="url(#gold)" font-weight="700">Areas of Interest</text>
<text x="640" y="540">• Game Development</text>
<text x="640" y="575">• GUI Development</text>
<text x="640" y="610">• Python Framework Development</text>
<text x="640" y="645">• Open Source Development</text>
<text x="640" y="680">• Desktop Application Development</text>
</g>

<rect x="70" y="760" width="340" height="2" fill="#D4AF37">
<animate attributeName="width" values="0;340;0" dur="4s" repeatCount="indefinite"/>
</rect>

<text x="70" y="790" font-family="JetBrains Mono" font-size="18" fill="#C8C8C8">
Learning by building • Improving every project
</text>

</svg>
